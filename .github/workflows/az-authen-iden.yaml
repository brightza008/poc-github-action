name: Authen wtih managed identity
on: 
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ##${{ secrets.AZURE_CLIENT_ID }}##
          tenant-id:  ##${{ secrets.AZURE_TENANT_ID }}##
          subscription-id: ##${{ secrets.AZURE_SUBSCRIPTION_ID }}##
          enable-AzPSSession: true

      - name: az cli
        run: |
          az resource list
