name: Related Dropdowns Example

on:
  workflow_dispatch:
    inputs:
      primary_option:
        description: "Choose the primary option"
        required: true
        type: choice
        options:
          - OptionA
          - OptionB
      secondary_option:
        description: "Choose the secondary option (related to primary)"
        required: true
        default: "Default"
        type: choice
        options:
          - Default
          - A1
          - A2
          - B1
          - B2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Input Relationship
        run: |
          echo "Primary: ${{ github.event.inputs.primary_option }}"
          echo "Secondary: ${{ github.event.inputs.secondary_option }}"
          case ${{ github.event.inputs.primary_option }} in
            "OptionA")
              case ${{ github.event.inputs.secondary_option }} in
                "A1"|"A2")
                  echo "Valid combination: Option A -> ${{ github.event.inputs.secondary_option }}"
                  ;;
                *)
                  echo "Invalid secondary option for Option A!" >&2
                  exit 1
                  ;;
              esac
              ;;
            "OptionB")
              case ${{ github.event.inputs.secondary_option }} in
                "B1"|"B2")
                  echo "Valid combination: Option B -> ${{ github.event.inputs.secondary_option }}"
                  ;;
                *)
                  echo "Invalid secondary option for Option B!" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Invalid primary option!" >&2
              exit 1
              ;;
          esac
