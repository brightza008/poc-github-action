name: example-workflow
on:
  workflow_dispatch:
  push:
    branches:
      - 'action-ci'
      - 'rc/**'
    paths:
      - .github/workflows/env-with-condition.yaml

env:
  Project: "mpay-modernization"
  JobEnvironment: ${{ github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch' && startsWith(github.event.ref, 'action-ci') && 'feature-branch' || github.event.ref_type == 'branch' && startsWith(github.event.ref, 'rc/') && 'dev-branch' }}

jobs:
  your-job-name:
    runs-on: ubuntu-latest

    steps:
      - name: Set up environment variables
        run: |
          echo "Project: $Project, JobEnvironment: $JobEnvironment"

    